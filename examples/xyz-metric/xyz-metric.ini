[EMC]
MACHINE = XYZ Metric
VERSION = 1.1

[DISPLAY]
DISPLAY = flexgui
GUI = xyz-metric.ui

[FLEXGUI]
JOG_INCREMENTS = 10, 5, 1, 0.1

[KINS]
JOINTS = 3
KINEMATICS = trivkins coordinates=XYZ

[RS274NGC]
PARAMETER_FILE = parameters.var

[HAL]
HALFILE = main.hal

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[TRAJ]
