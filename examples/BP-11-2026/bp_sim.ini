
[EMC]
MACHINE = BP 2026 Sim
VERSION = 1.1

[DISPLAY]
DISPLAY = flexgui
GUI = bp.ui
INTRO_GRAPHIC = emc2.gif
INTRO_TIME = 0
OPEN_FILE = ""

[FLEXGUI]
MANUAL_TOOL_CHANGE = True
QSS = touch.qss
SIZE = normal
TOUCH_SPINBOX = True
JOG_INCREMENTS = 1.0, 0.5, 0.1, 0.01, 0.001
RESOURCES = resources.py
PLOT_GRID = 1/2 inch
DEFAULT_GRID = .5

[KINS]
JOINTS = 3
KINEMATICS = trivkins coordinates=XYZ

[RS274NGC]
PARAMETER_FILE = parameters.var
SUBROUTINE_PATH = ./subroutines

[HAL]
HALFILE = main_sim.hal
POSTGUI_HALFILE = postgui_sim.hal

[TASK]
